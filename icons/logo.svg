<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Mic Mesh Gradient -->
    <linearGradient id="micHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Handle Gradient -->
    <linearGradient id="micBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Glow Border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="8" />

  <!-- Dynamic Equalizer Waves in Background -->
  <g opacity="0.35" transform="translate(0, 10)">
    <rect x="96" y="270" width="16" height="70" rx="8" fill="#38bdf8" />
    <rect x="124" y="230" width="16" height="110" rx="8" fill="#818cf8" />
    <rect x="152" y="190" width="16" height="150" rx="8" fill="#c084fc" />
    
    <rect x="344" y="190" width="16" height="150" rx="8" fill="#c084fc" />
    <rect x="372" y="230" width="16" height="110" rx="8" fill="#818cf8" />
    <rect x="400" y="270" width="16" height="70" rx="8" fill="#38bdf8" />
  </g>

  <!-- Big Musical Note Ribbon Wave Behind Mic -->
  <path d="M 120 180 C 180 80, 330 90, 390 190 C 420 240, 390 320, 320 320 C 260 320, 240 260, 290 230" 
        fill="none" stroke="url(#rimGrad)" stroke-width="12" stroke-linecap="round" opacity="0.45" />

  <!-- Center Group: Stylized Studio Microphone angled at 45deg -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    <!-- Mic Head Glow -->
    <ellipse cx="256" cy="180" rx="58" ry="72" fill="url(#micHead)" filter="url(#glow)" opacity="0.6" />

    <!-- Mic Mesh Head -->
    <ellipse cx="256" cy="180" rx="52" ry="66" fill="url(#micHead)" />
    <!-- Mesh lines pattern -->
    <path d="M 220 180 H 292 M 224 160 H 288 M 224 200 H 288 M 256 120 V 240 M 238 130 V 230 M 274 130 V 230" 
          stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
    
    <!-- Metallic Ring Connector -->
    <rect x="218" y="246" width="76" height="14" rx="7" fill="url(#goldGrad)" stroke="#ca8a04" stroke-width="1" />

    <!-- Mic Body / Handle -->
    <path d="M 226 260 L 234 370 C 234 382, 278 382, 278 370 L 286 260 Z" fill="url(#micBody)" />
    
    <!-- Power/Indicator Switch -->
    <rect x="250" y="295" width="12" height="26" rx="6" fill="#1e293b" />
    <circle cx="256" cy="304" r="3.5" fill="#22c55e" />

    <!-- Mic Bottom Base Ring -->
    <ellipse cx="256" cy="370" rx="22" ry="8" fill="url(#goldGrad)" />
  </g>

  <!-- Glowing Musical Symbols Floating -->
  <!-- Note 1 -->
  <g transform="translate(360, 110) scale(0.9)" filter="url(#glow)">
    <ellipse cx="25" cy="40" rx="14" ry="10" fill="#fde047" transform="rotate(-20 25 40)" />
    <rect x="34" y="10" width="5" height="32" rx="2.5" fill="#fde047" />
    <path d="M 37 10 C 50 14, 55 24, 52 35" fill="none" stroke="#fde047" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Note 2 -->
  <g transform="translate(90, 120) scale(0.75)" filter="url(#glow)">
    <ellipse cx="20" cy="35" rx="12" ry="9" fill="#06b6d4" transform="rotate(-20 20 35)" />
    <rect x="28" y="8" width="4" height="28" rx="2" fill="#06b6d4" />
  </g>

  <!-- Vietnam Golden Star Badge on Bottom-Right -->
  <g transform="translate(365, 365) scale(0.85)">
    <circle cx="45" cy="45" r="42" fill="#dc2626" stroke="#fbbf24" stroke-width="4" filter="url(#glow)" />
    <!-- 5-pointed Gold Star -->
    <polygon points="45,18 53,35 72,35 57,47 62,65 45,53 28,65 33,47 18,35 37,35" fill="#fbbf24" />
  </g>

  <!-- Modern Brand Monogram VN Ribbon on Bottom Left -->
  <g transform="translate(68, 385)">
    <rect x="0" y="0" width="90" height="36" rx="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    <text x="45" y="24" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="20" fill="#38bdf8" text-anchor="middle" letter-spacing="2">KOK</text>
  </g>
</svg>
